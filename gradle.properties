org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official

android.useAndroidX=true
android.nonTransitiveRClass=true

# We compile against compileSdk=36 on this machine (highest installed platform);
# AGP 8.7.3 was officially tested only to 35. Behavior is fine in practice.
android.suppressUnsupportedCompileSdk=36
